# ~/.config/tmux/cheatsheet-more.conf — page 2 of the prefix ? cheatsheet.
# Reached via "More" on page 1 (cheatsheet-main.conf); see there for the split.
#
# Keep 17 in sync with the menu: rows below + 2 for the border.
# The leading "" is load-bearing: it stops "-── panes ──" parsing as a flag.

if -F "#{e|<:#{client_height},17}" {
  display-message "Cheatsheet page 2 needs 17 rows, window has #{client_height}; enlarge it or shrink the font"
} { display-menu -T "#[align=centre]#[fg=magenta,bold] tmux — page 2 " -x C -y C \
  ""                                                                                  \
  "-── panes ──"                      ""  ""                                          \
  "Split below   ( v = right )"       s   { split-window -v -c "#{pane_current_path}" } \
  "Navigate right   ( h j k l )"      l   { select-pane -R }                          \
  "-Resize            M-h M-j M-k M-l" "" ""                                          \
  "Zoom pane"                         z   { resize-pane -Z }                          \
  "Break pane into its own window"    "!" { break-pane }                              \
  "Kill pane"                         x   { confirm-before -p "kill-pane #P? (y/n)" kill-pane } \
  "-── help & config ──"              ""  ""                                          \
  "fzf: bindings, commands, panes"    F   { run-shell -b "TMUX_FZF_CLIENT='#{client_tty}' ~/.config/tmux/plugins/tmux-fzf/main.sh" } \
  "What does key X do?"               "/" { command-prompt -k -p key { list-keys -1N "%%" } } \
  "Full key list"                     "?" { list-keys -N }                            \
  "Reload tmux.conf"                  M-r { source-file ~/.config/tmux/tmux.conf ; display-message "tmux.conf reloaded" } \
  ""                                                                                  \
  "‹ Back"                            Space { source-file ~/.config/tmux/cheatsheet-main.conf } \
}
