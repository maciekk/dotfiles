# ~/.config/tmux/tmux.conf
#
# Originally seeded from https://github.com/omerxx/dotfiles/blob/master/tmux/tmux.conf
# (kept for the visuals; the keymap below is our own).
#
# Layout of this file:
#   1. Options        2. Plugins + plugin settings      3. run tpm
#   4. Keybindings    5. prefix ? cheatsheet menu (cheatsheet-*.conf)
#
# Keybindings live AFTER `run tpm` on purpose: plugins bind keys when they load,
# so anything bound before tpm can be silently clobbered by a plugin. Ours win.
#
# Forgot a key?  prefix ?   curated menu (also runs the thing you pick)
#                prefix F   fzf over ALL bindings / commands / panes / ...
#                prefix /   then a key -> tmux tells you what that key does

# ─── 1. Options ──────────────────────────────────────────────────────────────

set -g default-terminal 'screen-256color'
set -g terminal-overrides ',xterm-256color:RGB'
set -as terminal-features ',*:clipboard' # OSC 52 forwarding, e.g. remote Neovim yanks
set -g extended-keys on
set -g extended-keys-format csi-u

set -g prefix ^A
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard (OSC 52)
set -g status-position top       # macOS / darwin style
set -g mouse on                  # also makes scroll wheel scroll the pane, not history
setw -g mode-keys vi

set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# Window auto-naming.
#
# tmux 3.7 on macOS resolves a pane's command through proc_pidpath(), which
# follows symlinks, and then uses the basename. Claude Code installs as
#   ~/.local/bin/claude -> ~/.local/share/claude/versions/<version>
# so #{pane_current_command} for a Claude pane is a bare version number and
# every Claude window ends up named e.g. "2.1.233" — ambiguous between windows,
# and it silently changes on every Claude update. Verified with
#   python3 -c 'proc_pidpath(<claude pid>)'  ->  .../versions/2.1.233
#   ps -o comm= -p <claude pid>              ->  claude
#
# So: anything version-shaped is really Claude. Two spellings of the same test —
# @_cmd_name is the bare command, @_cmd_label adds the project dir for tabs.
set -g @_is_claude "#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}}"
set -g @_cmd_name  "#{?#{E:@_is_claude},claude,#{pane_current_command}}"
set -g @_cmd_label "#{?#{E:@_is_claude},claude:#{b:pane_current_path},#{pane_current_command}}"

# Stock format is
#   #{?pane_in_mode,[tmux],#{pane_current_command}}#{?pane_dead,[dead],}
# — same thing, with the command run through @_cmd_label.
set -g automatic-rename-format "#{?pane_in_mode,[tmux],#{E:@_cmd_label}}#{?pane_dead,[dead],}"

# ─── 2. Plugins ──────────────────────────────────────────────────────────────

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.1'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'omerxx/tmux-sessionx'    # prefix o  - fuzzy session switcher
set -g @plugin 'sainnhe/tmux-fzf'        # prefix F  - fuzzy everything, incl. keybindings
set -g @plugin 'wfxr/tmux-fzf-url'       # prefix U  - pick a URL off the screen
set -g @plugin 'fcsonline/tmux-thumbs'   # prefix f  - vimium-style hint-copy
# Deliberately not used:
#   tmux-plugins/tmux-sensible  - only sets options we already set explicitly
#   tmux-plugins/tmux-resurrect + tmux-continuum

# sessionx — the main session switcher. In-picker keys are alt-based:
#   alt-s windows   alt-w tree   alt-r rename   alt-x kill   alt-c new window
#   alt-h back      alt-e config path           ? toggle preview
set -g @sessionx-bind 'o'
set -g @sessionx-x-path '~/src/dotfiles'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'        # create a session in any zoxide-known dir
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-enabled 'true'

# tmux-fzf — launch key is an env var, not a tmux option.
set-environment -g TMUX_FZF_LAUNCH_KEY 'F'

# fzf-url — visible pane only. Its U binding is overridden below by our compact,
# right-shifted picker, which keeps the plugin's fzf UI while sizing to results.
set -g @fzf-url-bind 'U'
set -g @fzf-url-history-limit 'screen'
set -g @url-picker-width-percent 60
set -g @url-picker-max-height-percent 40
set -g @url-picker-x-offset 20

# thumbs — moved off its default `space`, which is next-layout.
set -g @thumbs-key f
set -g @thumbs-unique enabled
set -g @thumbs-position off_left
set -g @thumbs-command 'tmux set-buffer -w -- {} && tmux display-message "copied {}"'

# catppuccin — v2 API (plugin is pinned to v2.3.1 in the @plugin line above;
# there is no v3). This block was v1 config for a long time; the v1 names that
# v2 dropped (@catppuccin_flavour with the "u", @catppuccin_status_modules_*,
# @catppuccin_window_default_*, @catppuccin_status_fill) are gone from here now.
#
# Everything below must be set BEFORE `run tpm`: catppuccin.tmux sources the
# flavour file and *builds* the @catppuccin_status_<module> strings at load time
# from these options. The status-left/status-right composition that consumes
# those strings therefore has to come AFTER tpm — see section 3b.
#
# Wipe catppuccin's whole namespace first, or a reload is a silent no-op for
# anything colour-related. Most of its derived state is stored with `set -o`
# (only-if-unset): @thm_* come from themes/catppuccin_<flavour>_tmux.conf, and
# each module's @catppuccin_status_<mod>_{icon,text}_fg is set with `-ogqF`,
# i.e. resolved to literal hex on first load and never refreshed. So changing
# @catppuccin_flavor and re-sourcing changes nothing at all.
#
# Do NOT use catppuccin's own @catppuccin_reset for this. It lives inside
# catppuccin_options_tmux.conf, which runs during `run tpm` — i.e. AFTER this
# section — so it unsets the @catppuccin_window_* options we set just below and
# drops the tab bar to plugin defaults (basic style, #T instead of #W, number on
# the left). Clearing the namespace up here happens before we set anything.
#
# `run-shell` without -b is synchronous and keeps config order (verified), so
# this completes before the sets below.
run-shell "tmux show -g | grep -oE '^@(thm|catppuccin|_ctp)[a-zA-Z0-9_]*' | xargs -n1 tmux set -gu"
# Follow macOS appearance (Latte/Mocha), with persistent auto/light/dark overrides.
# Existing theme.local.conf profiles still take precedence. Select before TPM,
# which resolves palette and module colours at load time.
run-shell 'sh ~/.config/tmux/appearance.sh select'

# Window tabs: "  claude:dotfiles 1 ", number on the right.
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
# Inactive tabs blend into the mantle status bar; the current tab gets a
# surface-0 pill. Inactive titles use subtext-0 so the active window stands out.
set -g @catppuccin_window_text '#[fg=#{@thm_subtext_0}] #W'
set -g @catppuccin_window_text_color '#{@thm_mantle}'
set -g @catppuccin_window_number_color '#{@thm_surface_2}'
set -g @catppuccin_window_current_text ' #W'
set -g @catppuccin_window_current_text_color '#{@thm_surface_0}'
# Zoom/bell/activity get catppuccin's own flag icons rather than a hand-rolled
# #{?window_zoomed_flag,...}, which does not survive the nested #{E:} expansion
# window-status-format puts these through.
set -g @catppuccin_window_flags 'icon'
set -g @catppuccin_window_flags_icon_current ''
set -g @catppuccin_window_flags_icon_last ''

# The modules' left cap is U+E0B6 (Nerd Font "left half circle thick"). utils/
# status_module.conf draws it with fg = the module's icon colour and bg=default,
# so it renders as a rounded half-circle in the module's own colour. A bare space
# here silently squares off every module, leaving the icon flush against the left
# edge of the coloured block. Keep the glyph literal — anything that strips
# private-use codepoints from this file will quietly flatten the status bar.
set -g @catppuccin_status_left_separator ''
# Right stays a plain space, matching upstream: the coloured block just ends,
# giving a flat finish. Use  instead to close the pill on the right too.
set -g @catppuccin_status_right_separator ' '
set -g @catppuccin_status_connect_separator 'no'

# Data modules follow the inactive tabs: their text blocks use the bar colour,
# leaving only the coloured icon caps prominent. text_fg is per-module — there
# is no global — and must be set before tpm so the plugin default does not win.
set -g @catppuccin_status_module_text_bg '#{@thm_mantle}'
set -g @catppuccin_status_session_text_fg '#{@thm_subtext_0}'
set -g @catppuccin_status_application_text_fg '#{@thm_subtext_0}'
set -g @catppuccin_status_host_text_fg '#{@thm_subtext_0}'
set -g @catppuccin_status_date_time_text_fg '#{@thm_subtext_0}'
set -g @catppuccin_application_icon '▶ '
set -g @catppuccin_date_time_text ' %m/%d %H:%M'

# TODO: pick out better icons using:
#   https://symbl.cc/en/unicode-table/#miscellaneous-symbols

# ─── 3. Load plugins ─────────────────────────────────────────────────────────

# tpm sources every plugin's *.tmux file, catppuccin included (it lands in
# plugins/tmux/, since tpm names dirs after the repo, not the owner).
run '~/.config/tmux/plugins/tpm/tpm'

# ─── 3b. Status bar & post-plugin overrides ──────────────────────────────────
#
# Must come after tpm: everything here references @catppuccin_status_* / @thm_*
# variables that catppuccin.tmux only defines once it has loaded.

# Stock lengths are 10 and 40, which is why the session name used to render
# clipped ("[tmux-vis-fix]" -> "[tmux-vis-"). The catppuccin modules are wider
# than that on their own.
set -g status-left-length 100
set -g status-right-length 100

# Leave one blank theme-base row between the top status line and pane contents.
# Do not use `fill=default`: that delegates to the terminal's default background,
# which can remain dark after a terminal theme switch.
set -g status 2
set -gF 'status-format[1]' '#[fill=#{@thm_bg}]'

# Catppuccin v1 used legacy `status-bg`; remove any value it left in a long-lived
# tmux server. v2 sets the complete `status-style` above instead.
set -gu status-bg
set -gu status-fg

set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_host}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
# Status jobs run asynchronously while attached; no daemon or sleeping process.
# The check emits no text and reloads only when the appearance changes.
set -g status-interval 15
set -ag status-right '#(sh ~/.config/tmux/appearance.sh check)'

# The application module defaults to a raw #{pane_current_command}, which would
# put the bare Claude version number back in the status bar. See @_cmd_name.
set -g @catppuccin_application_text " #{E:@_cmd_name}"

# catppuccin's message styles (catppuccin_tmux.conf:39-40) break command-prompt
# in two separate ways. Compare against the tmux defaults:
#   stock:       message-style bg=yellow,fg=black,fill=yellow
#   catppuccin:  message-style fg=#{@thm_teal},bg=default,align=centre
#
#   * align=centre — tmux draws the prompt text centred but still computes the
#     cursor column as if it were left-aligned, so `prefix R` shows the existing
#     name in one place and inserts what you type in another. This is the
#     visible "spacing is off" bug. A/B in a nested tmux, same prompt:
#       align=centre:  ...zsh 1  tmux-vis-fix     (rename-session)     13:21
#       left-aligned:  (rename-session) tmux-vis-fix
#   * no fill= — fill is what makes tmux clear the whole status line for the
#     prompt. Without it only the columns the prompt text occupies are painted
#     and the rest of the status bar shows through to the right of your input:
#       fill absent:   (rename-session) vsess claude:dotfiles 3   ▶ claude  ...
#       fill set:      (rename-session) vsess
#
# @thm_mantle is what catppuccin uses for status-style bg, so the prompt line
# stays flush with the status bar.
set -gF message-style "fg=#{@thm_teal},bg=default,fill=#{@thm_mantle}"
set -gF message-command-style "fg=#{@thm_teal},bg=default,fill=#{@thm_mantle}"

# ─── 4. Keybindings ──────────────────────────────────────────────────────────
#
# Only the deltas from stock tmux are listed; every default binding we don't
# mention still works. Rule of thumb: lowercase acts on the window/pane,
# UPPERCASE acts on the session.

# Override tmux-fzf-url's fixed-size picker with the local adaptive one. This
# must be after `run tpm`, because the plugin binds U when it loads. Pass the
# invoking pane explicitly: run-shell otherwise defaults to tmux's globally
# active pane, which can differ from the copy-mode pane. In copy-mode, use bare
# U so capture-pane -M reads the viewport currently being examined.
bind U run-shell -b "bash ~/.config/tmux/url-picker.sh '#{pane_id}'"
bind -T copy-mode-vi U run-shell -b "bash ~/.config/tmux/url-picker.sh '#{pane_id}'"

bind C-a send-prefix             # prefix prefix -> send a literal C-a through

# Sessions
bind S choose-tree -Zs           # native session picker (sessionx on `o` is nicer)
bind R command-prompt -I "#S" { rename-session -- "%%" }
bind a last-window
bind C-d detach
bind C-x lock-server
#   ( ) switch session prev/next, D choose-client  -- stock

# Windows
bind c new-window -c "#{pane_current_path}"
bind C new-window -c "$HOME"
bind r command-prompt -I "#W" { rename-window -- "%%" }
bind w choose-tree -Zw           # stock, but zoomed
bind H previous-window
bind L next-window
#   1-9 by index, & kill, . move  -- stock
#   (stock `f` find-window is gone; `f` is thumbs. Use prefix F -> window.)

# Panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R            # NB: overrides stock `l` = last-window (now `a`)
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind -r M-h resize-pane -L 5
bind -r M-j resize-pane -D 5
bind -r M-k resize-pane -U 5
bind -r M-l resize-pane -R 5
bind P set pane-border-status
bind * setw synchronize-panes
#   z zoom, q numbers, ! break out, x kill, { } swap,
#   Space next-layout, E even-out, M-1..M-7 layouts  -- stock
#   (stock `o` cycle-pane is gone; `o` is sessionx. Use q + number.)

# Scrollback / copy  (vi keys inside: / ? n N g G, v select, y yank)
bind u copy-mode -u              # enter scrollback, one page up
bind g copy-mode \; command-prompt -T search -p "(search up)" { send-keys -X search-backward -- "%%" }
bind -T copy-mode-vi v send-keys -X begin-selection
#   [ copy-mode, PgUp copy-mode -u, ] paste, # list buffers  -- stock
#   f thumbs (hint-copy), U fzf-url, prefix Y copy pane cwd  -- plugins

# Config
bind M-r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
# tpm keeps I=install and M-u=clean, but fzf-url takes its stock U=update, so
# re-home update on M-U. (tpm binds these at load time, hence the reach-in.)
bind M-U run-shell ~/.config/tmux/plugins/tpm/bindings/update_plugins

# ─── 5. Cheatsheet ───────────────────────────────────────────────────────────
# prefix ?  — the keys you actually use, as a two-page menu. Picking a row runs
# it, so this doubles as the escape hatch when you can't remember the key.
# Pages live in cheatsheet-main.conf (page 1) and cheatsheet-more.conf (page 2).

bind ? source-file ~/.config/tmux/cheatsheet-main.conf
