# Bright theme profile.
set -g @catppuccin_flavor 'latte'

# Latte's crust is too light to use as foreground text on its accent colours.
set -g @thm_crust '#11111b'

# Lighten Latte's native accents against the bright status bar while preserving
# enough contrast for the dark icon foreground above.
set -g @catppuccin_session_color '#{?client_prefix,#df758e,#8fc486}'
set -g @catppuccin_application_color '#ea929c'
set -g @catppuccin_host_color '#b68cf2'
set -g @catppuccin_date_time_color '#7dc4d2'
set -g @catppuccin_window_current_number_color '#aab7f9'
