# ~/.config/tmux/cheatsheet-main.conf — page 1 of the prefix ? cheatsheet.
# Sourced by `bind ?` in tmux.conf and by "‹ Back" on page 2.
#
# Split is per category so you never hunt across pages:
#   page 1: sessions, windows, scrollback & copy
#   page 2: panes, help & config  (cheatsheet-more.conf)
#
# tmux silently refuses to draw a menu taller than the client, so check first.
# Keep 23 in sync with the menu: rows below + 2 for the border.
# The leading "" is load-bearing: it stops "-── sessions ──" parsing as a flag.

if -F "#{e|<:#{client_height},23}" {
  display-message "Cheatsheet needs 23 rows, window has #{client_height}; enlarge it or shrink the font"
} { display-menu -T "#[align=centre]#[fg=magenta,bold] tmux — prefix is C-a " -x C -y C \
  ""                                                                                  \
  "-── sessions ──"                   ""  ""                                          \
  "Switch session (fuzzy)"            o   { run-shell "~/.config/tmux/plugins/tmux-sessionx/scripts/sessionx.sh" } \
  "Switch session (tree)"             S   { choose-tree -Zs }                         \
  "Rename session"                    R   { command-prompt -I "#S" { rename-session "%%" } } \
  "Next session   ( ( = prev )"       ")" { switch-client -n }                         \
  "-── windows ──"                    ""  ""                                          \
  "New window here  ( C = at ~ )"     c   { new-window -c "#{pane_current_path}" }     \
  "Rename window"                     r   { command-prompt -I "#W" { rename-window "%%" } } \
  "Choose window"                     w   { choose-tree -Zw }                         \
  "Next window   ( H = prev )"        L   { next-window }                             \
  "Last window"                       a   { last-window }                             \
  "Kill window"                       "&" { confirm-before -p "kill-window #W? (y/n)" kill-window } \
  "-── scrollback & copy ──"          ""  ""                                          \
  "Scrollback (page up)"              u   { copy-mode -u }                            \
  "Scrollback, then search up"        g   { copy-mode ; command-prompt -T search -p "(search up)" { send-keys -X search-backward "%%" } } \
  "Hint-copy paths/SHAs on screen"    f   { run-shell -b "~/.config/tmux/plugins/tmux-thumbs/tmux-thumbs.sh" } \
  "Open a URL from the screen"        U   { run-shell -b "bash ~/.config/tmux/url-picker.sh '#{pane_id}'" } \
  "Copy this pane's cwd"              Y   { run-shell -b "~/.config/tmux/plugins/tmux-yank/scripts/copy_pane_pwd.sh" } \
  ""                                                                                  \
  "More: panes, help & config  ›"     Space { source-file ~/.config/tmux/cheatsheet-more.conf } \
}
